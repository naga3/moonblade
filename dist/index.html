<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101421">
<meta name="description" content="320×240ピクセル・64色・16×16ドットの横スクロール剣アクション。月夜の遺跡を駆け抜けよう。">
<title>月影の剣 — MOONBLADE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101421}body{display:grid;place-items:center;touch-action:none;overscroll-behavior:none}canvas{display:block;position:absolute;width:320px;height:240px;image-rendering:pixelated;image-rendering:crisp-edges;outline:none;touch-action:none;cursor:crosshair}#game{z-index:1}#pad{display:none;z-index:0}
</style>
</head>
<body>
<canvas id="pad" aria-hidden="true"></canvas>
<canvas id="game" width="320" height="240" tabindex="0" role="application" aria-label="月影の剣。矢印キーで移動、Zで剣、Xかスペースでジャンプ。上とZで上突き、空中で下とZで下突き。Enterで開始、Pで一時停止、Mで消音。スマートフォンでは画面の外のスティックとボタンで操作できる。"></canvas>
<script src="art-data.js"></script>
<script src="audio-data.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
